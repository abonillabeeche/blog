name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Blocklist
        env:
          BLOCKLIST: ${{ secrets.BLOCKLIST }}
        run: ./scripts/check-blocklist.sh
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true
      - name: Build
        run: hugo --minify --panicOnWarning
      - name: Links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir ${{ github.workspace }}/public public/
          fail: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  apex:
    # Rebuild 5glinux.com so its "Latest from the blog" list picks up new posts.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger 5glinux.com rebuild
        env:
          TOKEN: ${{ secrets.APEX_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "APEX_DISPATCH_TOKEN not set; skipping"; exit 0; fi
          sleep 30   # let the Pages CDN serve the new feed first
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/abonillabeeche/5glinux-site/dispatches \
            -d '{"event_type":"blog-published"}')
          echo "repository_dispatch HTTP $code"
          [ "$code" = 204 ]

  indexnow:
    # Tell Bing, Yandex and other IndexNow engines which URLs exist, right after a deploy.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs
        env:
          HOST: blog.5glinux.com
          KEY: 727e148d0890251c03ab75ed459b9c36
        run: |
          sleep 30   # let the Pages CDN pick up the new deploy
          urls=$(curl -fsSL "https://$HOST/sitemap.xml" | grep -oE '<loc>[^<]+' | sed 's/<loc>//')
          body=$(printf '%s\n' "$urls" | jq -R -s --arg host "$HOST" --arg key "$KEY" \
            --arg loc "https://$HOST/$KEY.txt" \
            '{host:$host, key:$key, keyLocation:$loc, urlList:(split("\n")|map(select(length>0)))}')
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow HTTP $code for $(echo "$urls" | wc -l) URLs"
          case "$code" in 200|202) ;; *) exit 1 ;; esac
